name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App for iOS Device (Unsigned)
        run: |
          xcodebuild build \
            -project DentistGame.xcodeproj \
            -scheme DentistGame \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package DentistGame.ipa
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/DentistGame.app build/Payload/
          cd build
          zip -r -q DentistGame.ipa Payload
          cd ..
          ls -lh build/DentistGame.ipa

      - name: Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentistGame-iOS-IPA
          path: build/DentistGame.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Dentist Game iOS v1.0.0"
          draft: false
          prerelease: false
          make_latest: true
          files: build/DentistGame.ipa
          body: |
            ## 🦷 Bác Sĩ Nha Khoa (Dentist Game) - Bản Cài Đặt iOS (IPA)
            
            ### 📥 Hướng dẫn tải và cài đặt vào iPhone qua máy tính Windows:
            1. Tải file **`DentistGame.ipa`** đính kèm ở mục Assets bên dưới về máy tính Windows.
            2. Cắm iPhone vào máy tính Windows bằng cáp USB, mở khóa màn hình và chọn **"Tin cậy máy tính này"**.
            3. Mở phần mềm **Sideloadly** trên máy tính (đã cài ở `E:\Sideloadly` hoặc mở shortcut trên Desktop).
            4. Kéo thả file `DentistGame.ipa` vào Sideloadly.
            5. Nhập Apple ID (miễn phí) và bấm **START** để nạp game vào iPhone.
            6. Trên iPhone: Vào **Cài đặt > Cài đặt chung > Quản lý VPN & Thiết bị**, chọn Apple ID của bạn và chọn **Tin cậy** là có thể chơi được ngay!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
